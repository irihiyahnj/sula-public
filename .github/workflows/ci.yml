name: ci

on:
  push:
  pull_request:

jobs:
  vector:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sula Vector test suite
        run: python -m unittest tools.sula_vector.tests.test_sula_vector -v
      - name: Vector integrity (doctor must exit 0)
        run: python tools/sula_vector/render.py . --view doctor
      - name: Boot context renders
        run: python tools/sula_vector/render.py . --for-agent > /dev/null
      - name: Byte-stable replay
        run: |
          python tools/sula_vector/render.py . --for-agent > /tmp/a.txt
          python tools/sula_vector/render.py . --for-agent > /tmp/b.txt
          diff /tmp/a.txt /tmp/b.txt
      - name: Example vector renders and is clean
        run: python tools/sula_vector/render.py tools/sula_vector/example --view doctor
